{% extends "base.html" %}

{% block title %}Edit Game{% endblock %}

{% block content %}

<h1 class="mb-4">Edit Game</h1>

<form method="POST" class="card steam-card p-4">

    <div class="mb-3">
        <label class="form-label">App ID</label>
        <input
            type="number"
            class="form-control"
            value="{{ game[0] }}"
            readonly>
    </div>

    <div class="mb-3">
        <label class="form-label">Game Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ game[1] }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Release Date</label>
        <input
            type="date"
            name="release_date"
            class="form-control"
            value="{{ game[2] }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Price</label>
        <input
            type="number"
            step="0.01"
            name="price"
            class="form-control"
            value="{{ game[3] }}"
            required>
    </div>

    <button type="submit" class="btn btn-warning">
        Save Changes
    </button>

    <a href="/games" class="btn btn-secondary mt-2">
        Cancel
    </a>

</form>

{% endblock %}
