{% extends "base.html" %}
{% block title %}Most Expensive Games{% endblock %}
{% block content %}
<h1 class="mb-4">Most Expensive Games</h1>
<table class="table table-striped table-hover table-bordered">
<thead class="table-warning"><tr><th>Game</th><th>Price</th></tr></thead>
<tbody>
{% for game in games %}
<tr><td>{{ game[0] }}</td><td>${{ game[1] }}</td></tr>
{% endfor %}
</tbody>
</table>
<a href="/" class="btn btn-secondary">Back Home</a>
{% endblock %}
