<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Steam Store Database{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0b1622, #1b2838);
            color: #c7d5e0;
            min-height: 100vh;
        }

        .navbar {
            background-color: #171a21 !important;
            border-bottom: 2px solid #66c0f4;
        }

        .navbar-brand {
            color: #66c0f4 !important;
            font-weight: bold;
        }

        .nav-link {
            color: #c7d5e0 !important;
        }

        .nav-link:hover {
            color: #66c0f4 !important;
        }

        .container {
            margin-top: 35px;
        }

        h1, h2, h3, h4 {
            color: #ffffff;
            font-weight: bold;
        }

        .steam-card {
            background-color: #16202d;
            border: 1px solid #2a475e;
            color: #c7d5e0;
            box-shadow: 0 0 15px rgba(102, 192, 244, 0.15);
        }

        .card {
            background-color: #16202d;
            border: 1px solid #2a475e;
            color: #c7d5e0;
        }

        .table {
            color: #c7d5e0;
        }

        .table thead {
            background-color: #171a21;
            color: #66c0f4;
        }

        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: #1b2838;
            color: #c7d5e0;
        }

        .table-striped > tbody > tr:nth-of-type(even) > * {
            background-color: #16202d;
            color: #c7d5e0;
        }

        .table-hover tbody tr:hover td {
            background-color: #2a475e;
            color: #ffffff;
        }

        a {
            color: #66c0f4;
        }

        a:hover {
            color: #ffffff;
        }

        .btn-steam {
            background-color: #66c0f4;
            color: #171a21;
            border: none;
            font-weight: bold;
        }

        .btn-steam:hover {
            background-color: #8ed8ff;
            color: #171a21;
        }

        .btn-outline-steam {
            border: 1px solid #66c0f4;
            color: #66c0f4;
        }

        .btn-outline-steam:hover {
            background-color: #66c0f4;
            color: #171a21;
        }

        .list-group-item {
            background-color: #1b2838;
            color: #c7d5e0;
            border-color: #2a475e;
        }

        .form-control {
            background-color: #0b1622;
            color: #ffffff;
            border: 1px solid #2a475e;
        }

        .form-control:focus {
            background-color: #0b1622;
            color: #ffffff;
            border-color: #66c0f4;
            box-shadow: 0 0 0 0.25rem rgba(102, 192, 244, 0.25);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="/">Steam Store Database</a>

    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/games">Games</a>
        <a class="nav-link" href="/genres">Genres</a>
        <a class="nav-link" href="/developers">Developers</a>
        <a class="nav-link" href="/publishers">Publishers</a>
        <a class="nav-link" href="/platforms">Platforms</a>
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/top-rated">Top Rated</a>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
