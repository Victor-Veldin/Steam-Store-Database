{% extends "base.html" %}

{% block title %}Games - Steam Store Database{% endblock %}

{% block content %}

<h1 class="mb-4">Steam Games</h1>

<form method="GET" action="/games" class="mb-3">
    <div class="input-group">
        <input
            type="text"
            class="form-control"
            name="search"
            placeholder="Search game..."
            value="{{ search }}"
        >
        <button class="btn btn-primary" type="submit">
            Search
        </button>
    </div>
</form>

<div class="table-responsive">

    <table class="table table-striped table-hover table-bordered">

        <thead class="table-dark">
            <tr>
                <th>App ID</th>
                <th>Name</th>
                <th>Release Date</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>

            {% for game in games %}
            <tr>

                <td>{{ game[0] }}</td>

                <td>
                    <a href="/game/{{ game[0] }}">
                        {{ game[1] }}
                    </a>
                </td>

                <td>{{ game[2] }}</td>

                <td>
                    ${{ game[3] }}
                </td>

            </tr>
            {% endfor %}

        </tbody>

    </table>

</div>

<a href="/" class="btn btn-secondary">
    Back Home
</a>

{% endblock %}
